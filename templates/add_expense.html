{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/expenses.css') }}">
{% endblock %}

{% block content %}
<div class="expense-form-container">
    <header class="expense-form-header">
        <h1>Add New Expense</h1>
        <p>Keep your spending on track</p>
    </header>

    <form method="POST" action="{{ url_for('add_expense') }}">
        <div class="expense-form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" id="amount" name="amount"
                   class="expense-form-control" required inputmode="decimal"
                   value="{{ form_data.amount if form_data else '' }}">
        </div>

        <div class="expense-form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="expense-form-control" required>
                <option value="" disabled {% if not form_data or not form_data.category %}selected{% endif %}>Select a category</option>
                {% for cat in categories %}
                    <option value="{{ cat }}" {{ 'selected' if form_data and form_data.category == cat }}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="expense-form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" class="expense-form-control" required
                   value="{{ form_data.date if form_data else today }}">
        </div>

        <div class="expense-form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" id="description" name="description" maxlength="200"
                   class="expense-form-control"
                   value="{{ form_data.description if form_data else '' }}">
        </div>

        <div class="expense-form-actions">
            <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Expense</button>
        </div>
    </form>
</div>
{% endblock %}
